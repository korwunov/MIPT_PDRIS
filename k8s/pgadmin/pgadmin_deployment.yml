apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pgadmin
  template:
    metadata:
      labels:
        app: pgadmin
    spec:
      containers:
        - name: pgadmin-container
          image: dpage/pgadmin4
          ports:
            - containerPort: 80
          imagePullPolicy: IfNotPresent
          env:
            - name: "PGADMIN_DEFAULT_EMAIL"
              value: "user@mail.com"
            - name: "PGADMIN_DEFAULT_PASSWORD"
              value: "password"
          volumeMounts:
              - name: pgadmin-storage
                mountPath: /var/lib/pgadmin
      volumes:
        - name: pgadmin-storage
          persistentVolumeClaim:
            claimName: pgadmin-pvc
